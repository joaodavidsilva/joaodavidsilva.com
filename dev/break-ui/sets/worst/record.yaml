record:
  name: João David Silva
  headline: "Engineering beyond implementation: specifications, review and the judgement that coding agents cannot supply, for teams shipping production software with AI."
  url: https://joaodavidsilva.com/
  email: me@joaodavidsilva.com
  interests: |
    I care about the parts of engineering that happen before and after the code: deciding what to build, writing it down so someone else can check it, and reviewing what comes back.

    Lately that someone else is often an agent, which makes the writing-down part matter more, not less.

    Outside work: running, bread, and teaching my kids their times tables with an app I built for the purpose.
  approach: |
    Specifications first, tests second, code third. Small pull requests. Public corrections.
