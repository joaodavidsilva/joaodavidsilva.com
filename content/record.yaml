record:
  name: João David Silva
  headline: "Lead AI Engineer: plan comprehensively, build incrementally, evolve continuously."
  url: https://joaodavidsilva.com/
  email: me@joaodavidsilva.com
  approach: |
    AI has changed how we build software, but most teams still organise the work around it as if implementation were the expensive part. It isn't any more. The bottleneck is now everything around the code: endless meetings that wear teams down, decisions that lose their context on the way from the customer to the product, and tickets and documents nobody keeps up to date.

    I want to lead teams that work differently: plan comprehensively, build incrementally, evolve continuously. Better decisions, shorter feedback loops, and engineering artefacts (requirements, decisions, the domain's language) that evolve alongside the product and are shared by people and AI agents alike.

    I've lived it on Mind4EDP, used by more than 13,000 EDP colleagues: the mobile client began as hand-written code and grew into a project developed entirely by AI agents, kept on track by written decisions and small, verifiable tickets. The process is open-sourced as AI Skills, and I write about it at joaodavidsilva.com/writing.
  location: Lisbon, Portugal · remote within the EU
